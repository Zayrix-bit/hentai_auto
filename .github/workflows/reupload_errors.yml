name: Re-Upload Error Videos to DropEmbed

on:
  workflow_dispatch:
    inputs:
      max_videos_per_worker:
        description: 'Max videos per worker'
        required: false
        default: '10'

concurrency:
  group: reupload-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  prepare_targets:
    name: Load Re-Upload Targets
    runs-on: ubuntu-latest
    outputs:
      target_count: ${{ steps.load.outputs.target_count }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Load Re-Upload Targets
        id: load
        run: |
          if [ ! -f data/reupload_targets.json ]; then
            echo "No reupload_targets.json found, exiting."
            echo "target_count=0" >> $GITHUB_OUTPUT
            exit 0
          fi
          TARGET_COUNT=$(python -c "import json; print(len(json.load(open('data/reupload_targets.json'))))")
          echo "target_count=$TARGET_COUNT" >> $GITHUB_OUTPUT
          echo "Found $TARGET_COUNT re-upload targets."

      - name: Upload Targets Artifact
        if: steps.load.outputs.target_count != '0'
        uses: actions/upload-artifact@v4
        with:
          name: reupload-targets
          path: data/reupload_targets.json
          if-no-files-found: error

  upload_workers:
    name: ReUpload Worker ${{ matrix.worker.id }}/5
    needs: [prepare_targets]
    if: needs.prepare_targets.outputs.target_count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        worker:
          - { id: 1, index: 0 }
          - { id: 2, index: 1 }
          - { id: 3, index: 2 }
          - { id: 4, index: 3 }
          - { id: 5, index: 4 }

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install aria2 (Cloud Downloader)
        timeout-minutes: 3
        run: |
          sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout="15" -qq || true
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends aria2 || sudo apt-get install -y aria2

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Download Targets Artifact
        uses: actions/download-artifact@v4
        with:
          name: reupload-targets
          path: data

      - name: Re-Upload Worker (MP4 -> DropEmbed)
        env:
          PYTHONPATH: .
          DROPEMBED_API_KEY: ${{ secrets.DROPEMBED_API_KEY }}
          CPANEL_API_URL: ${{ secrets.CPANEL_API_URL }}
          CPANEL_API_SECRET: ${{ secrets.CPANEL_API_SECRET }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/auto_watcher.py \
            --targets-file data/reupload_targets.json \
            --max-videos ${{ github.event.inputs.max_videos_per_worker || '10' }} \
            --worker-index ${{ matrix.worker.index }} \
            --total-workers 5

      - name: Upload Worker Output Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reupload-catalog-${{ matrix.worker.index }}
          path: data/worker_output_*.json
          if-no-files-found: ignore

  aggregate_and_commit:
    name: Merge Re-Upload Results & Push
    needs: [upload_workers]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Download All Worker Catalog Artifacts
        uses: actions/download-artifact@v4
        with:
          path: worker_artifacts
          pattern: reupload-catalog-*
          merge-multiple: true

      - name: Merge Re-Uploaded Catalogs
        env:
          PYTHONPATH: .
        run: |
          python scripts/merge_catalogs.py worker_artifacts

      - name: Commit and Push Updated Video Catalog
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/videos.json data/videos.md
          git rm --cached data/reupload_targets.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No changes to catalog."
          else
            git commit -m "fix(auto): re-upload error-status videos [skip ci]"
            git pull --rebase
            git push
          fi
