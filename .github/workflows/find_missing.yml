name: Find Missing Episodes on Sukebei

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  find_missing:
    name: Search Sukebei for Missing Episodes
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4

      - name: Run Sukebei Missing Episode Search
        run: |
          python scripts/find_missing_sukebei.py

      - name: Upload Findings Artifact
        uses: actions/upload-artifact@v4
        with:
          name: missing-episodes-found
          path: |
            data/missing_episodes_found.json
            data/missing_targets.json
          if-no-files-found: warn

      - name: Commit and Push Findings
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/missing_episodes_found.json data/missing_targets.json
          if git diff --staged --quiet; then
            echo "No new findings."
          else
            git commit -m "chore: save missing episodes search findings from Sukebei [skip ci]"
            git pull --rebase
            git push
          fi
