name: Auto-Feed Pipeline (100% Automated)

on:
  schedule:
    # Runs automatically every 4 hours
    - cron: '0 */4 * * *'
  workflow_dispatch:
    inputs:
      max_videos:
        description: 'Maximum new videos to download and upload in this run'
        required: false
        default: '2'

permissions:
  contents: write

jobs:
  auto_upload:
    name: Auto Watcher & Cloud Upload
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install aria2c & ffmpeg (Cloud Downloader & Optimizer)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq aria2 ffmpeg

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Run Auto Watcher (Feed -> AniList -> DropEmbed -> cPanel)
        env:
          DROPEMBED_API_KEY: ${{ secrets.DROPEMBED_API_KEY }}
          CPANEL_API_URL: ${{ secrets.CPANEL_API_URL }}
          CPANEL_API_SECRET: ${{ secrets.CPANEL_API_SECRET }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/auto_watcher.py "${{ github.event.inputs.max_videos || '2' }}"

      - name: Commit and Push Updated Video Catalog
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/videos.json data/videos.md
          if git diff --staged --quiet; then
            echo "No changes to catalog."
          else
            git commit -m "chore(auto): catalog new automated releases [skip ci]"
            git pull --rebase
            git push
          fi
