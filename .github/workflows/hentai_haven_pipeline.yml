name: Hentai Haven Direct Pipeline (15 Parallel Workers)

on:
  workflow_dispatch:
    inputs:
      targets_file:
        description: 'Path to target Hentai Haven JSON'
        required: false
        default: 'data/hentai_haven_targets.json'
      max_videos_per_worker:
        description: 'Max videos per worker'
        required: false
        default: '15'

concurrency:
  group: hentai-haven-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  auto_upload:
    name: Worker ${{ matrix.worker.id }}/15
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        worker:
          - { id: 1, index: 0 }
          - { id: 2, index: 1 }
          - { id: 3, index: 2 }
          - { id: 4, index: 3 }
          - { id: 5, index: 4 }
          - { id: 6, index: 5 }
          - { id: 7, index: 6 }
          - { id: 8, index: 7 }
          - { id: 9, index: 8 }
          - { id: 10, index: 9 }
          - { id: 11, index: 10 }
          - { id: 12, index: 11 }
          - { id: 13, index: 12 }
          - { id: 14, index: 13 }
          - { id: 15, index: 14 }

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install aria2 (Cloud Downloader)
        timeout-minutes: 3
        run: |
          sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout="15" -qq || true
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends aria2 || sudo apt-get install -y aria2

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Process Hentai Haven Direct MP4 Worker (CDN -> MAL -> DropEmbed -> cPanel)
        env:
          PYTHONPATH: .
          DROPEMBED_API_KEY: ${{ secrets.DROPEMBED_API_KEY }}
          CPANEL_API_URL: ${{ secrets.CPANEL_API_URL }}
          CPANEL_API_SECRET: ${{ secrets.CPANEL_API_SECRET }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/auto_watcher.py \
            --targets-file "${{ github.event.inputs.targets_file || 'data/hentai_haven_targets.json' }}" \
            --max-videos ${{ github.event.inputs.max_videos_per_worker || '15' }} \
            --worker-index ${{ matrix.worker.index }} \
            --total-workers 15

      - name: Upload Worker Output Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: worker-catalog-${{ matrix.worker.index }}
          path: data/worker_output_*.json
          if-no-files-found: ignore

  aggregate_and_commit:
    name: Merge All Catalogs & Push to Git
    needs: [auto_upload]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Download All Worker Catalog Artifacts
        uses: actions/download-artifact@v4
        with:
          path: worker_artifacts
          pattern: worker-catalog-*
          merge-multiple: true

      - name: Merge Worker Catalogs
        env:
          PYTHONPATH: .
        run: |
          python scripts/merge_catalogs.py worker_artifacts

      - name: Commit and Push Updated Video Catalog
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/videos.json data/videos.md
          if git diff --staged --quiet; then
            echo "No changes to catalog."
          else
            git commit -m "chore(auto): catalog new Hentai Haven uploads [skip ci]"
            git pull --rebase
            git push
          fi
