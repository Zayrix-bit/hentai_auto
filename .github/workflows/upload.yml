name: Upload to DropEmbed (Cloud Runner)

on:
  workflow_dispatch:
    inputs:
      source_url:
        description: 'Magnet link, .torrent URL, or AnimeTosho link'
        required: true
        type: string
      custom_title:
        description: 'Custom Video Title (leave empty to use auto-detected title)'
        required: false
        type: string
        default: ''
      folder_id:
        description: 'DropEmbed Folder ID (optional, leave empty for root)'
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  cloud_pipeline:
    name: Download & Stream to DropEmbed
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install aria2c (High-speed Cloud Downloader)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq aria2

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Run Pipeline (Download & Cloud-to-Cloud Upload)
        env:
          DROPEMBED_API_KEY: ${{ secrets.DROPEMBED_API_KEY }}
        run: |
          python scripts/pipeline.py \
            --source "${{ github.event.inputs.source_url }}" \
            --title "${{ github.event.inputs.custom_title }}" \
            --folder-id "${{ github.event.inputs.folder_id }}"

      - name: Commit and Push Updated Video Catalog
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/videos.json data/videos.md
          if git diff --staged --quiet; then
            echo "No changes to catalog."
          else
            git commit -m "chore: catalog new DropEmbed upload [skip ci]"
            git pull --rebase
            git push
          fi
