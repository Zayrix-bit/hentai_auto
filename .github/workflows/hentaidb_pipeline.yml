name: HentaiDB 2D Anime Pipeline (Cloud Parallel Workers)

on:
  workflow_dispatch:
    inputs:
      videos_count:
        description: 'Number of targets to crawl and upload (e.g. 50)'
        required: false
        default: '50'
      start_series_index:
        description: 'Start series index in directory (0-2080)'
        required: false
        default: '0'
      max_videos_per_worker:
        description: 'Max videos per worker'
        required: false
        default: '10'

concurrency:
  group: hentaidb-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  crawl_targets:
    name: Crawl HentaiDB 2D Anime Targets
    runs-on: ubuntu-latest
    outputs:
      target_count: ${{ steps.crawl.outputs.target_count }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Crawl Fresh HentaiDB Targets
        id: crawl
        run: |
          COUNT="${{ github.event.inputs.videos_count || '50' }}"
          START="${{ github.event.inputs.start_series_index || '0' }}"
          python scripts/crawl_hentaidb_targets.py --count "$COUNT" --start "$START"
          TARGET_COUNT=$(python -c "import json; print(len(json.load(open('data/hentaidb_targets.json'))))")
          echo "target_count=$TARGET_COUNT" >> $GITHUB_OUTPUT
          echo "Discovered $TARGET_COUNT unuploaded pure 2D anime targets."

      - name: Upload Targets Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hentaidb-targets
          path: data/hentaidb_targets.json
          if-no-files-found: error

  upload_workers:
    name: Worker ${{ matrix.worker.id }}/5
    needs: [crawl_targets]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        worker:
          - { id: 1, index: 0 }
          - { id: 2, index: 1 }
          - { id: 3, index: 2 }
          - { id: 4, index: 3 }
          - { id: 5, index: 4 }

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install aria2 (Cloud Downloader)
        timeout-minutes: 3
        run: |
          sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout="15" -qq || true
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends aria2 || sudo apt-get install -y aria2

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Download Targets Artifact
        uses: actions/download-artifact@v4
        with:
          name: hentaidb-targets
          path: data

      - name: Process Worker (CDN MP4 -> DropEmbed -> cPanel)
        env:
          PYTHONPATH: .
          DROPEMBED_API_KEY: ${{ secrets.DROPEMBED_API_KEY }}
          CPANEL_API_URL: ${{ secrets.CPANEL_API_URL }}
          CPANEL_API_SECRET: ${{ secrets.CPANEL_API_SECRET }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/auto_watcher.py \
            --targets-file data/hentaidb_targets.json \
            --max-videos ${{ github.event.inputs.max_videos_per_worker || '10' }} \
            --worker-index ${{ matrix.worker.index }} \
            --total-workers 5

      - name: Upload Worker Output Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: worker-catalog-${{ matrix.worker.index }}
          path: data/worker_output_*.json
          if-no-files-found: ignore

  aggregate_and_commit:
    name: Merge Catalog & Push
    needs: [upload_workers]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Download All Worker Catalog Artifacts
        uses: actions/download-artifact@v4
        with:
          path: worker_artifacts
          pattern: worker-catalog-*
          merge-multiple: true

      - name: Merge Worker Catalogs
        env:
          PYTHONPATH: .
        run: |
          python scripts/merge_catalogs.py worker_artifacts

      - name: Commit and Push Updated Video Catalog
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/videos.json data/videos.md
          if git diff --staged --quiet; then
            echo "No changes to catalog."
          else
            git commit -m "chore(auto): catalog new HentaiDB 2D anime uploads [skip ci]"
            git pull --rebase
            git push
          fi
