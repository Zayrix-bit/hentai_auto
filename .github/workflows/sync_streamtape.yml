name: Sync DropEmbed Live Videos to Catalog & cPanel

on:
  workflow_dispatch:

concurrency:
  group: sync-dropembed-catalog
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync_and_catalog:
    name: Sync DropEmbed Account -> cPanel DB & Catalog
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Run DropEmbed Catalog Sync
        env:
          PYTHONPATH: .
          DROPEMBED_API_KEY: ${{ secrets.DROPEMBED_API_KEY }}
          CPANEL_API_URL: ${{ secrets.CPANEL_API_URL }}
          CPANEL_API_SECRET: ${{ secrets.CPANEL_API_SECRET }}
        run: |
          python scripts/sync_dropembed_catalog.py

      - name: Analyze Series Completeness
        run: |
          python scripts/analyze_series.py

      - name: Commit and Push Recovered Catalog
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/videos.json data/videos.md
          if git diff --staged --quiet; then
            echo "No new videos to commit."
          else
            git commit -m "chore(sync): recover uncataloged live DropEmbed uploads and sync cPanel [skip ci]"
            git pull --rebase
            git push
          fi
